[supervisord]
nodaemon=true

[program:gunicorn]
command=/usr/local/bin/gunicorn -k uvicorn.workers.UvicornWorker -w 4 main:app -b 127.0.0.1:8000
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/var/log/gunicorn_stdout.log
stderr_logfile=/var/log/gunicorn_stderr.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx_stdout.log
stderr_logfile=/var/log/nginx_stderr.log
